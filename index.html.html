<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saher AI - ساهر الذكي</title>
<style>
:root {
  --bg-dark: #0a0f1d;
  --panel-bg: #111827;
  --card-bg: #1f293d;
  --line-color: #2d3748;
  --gold-accent: #d4af37;
  --gold-hover: #f3c623;
  --blue-accent: #2563eb;
  --txt-main: #f3f4f6;
  --txt-muted: #9ca3af;
  --user-msg: #1e3a8a;
  --bot-msg: #1a233a;
  --shadow-color: rgba(0, 0, 0, 0.4);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg-dark);
  color: var(--txt-main);
  height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  background: var(--panel-bg);
  border-bottom: 1px solid var(--line-color);
  box-shadow: 0 4px 12px var(--shadow-color);
}

header h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.5px;
}
header h1 span {
  color: var(--gold-accent);
  text-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
}

button {
  font: inherit;
  cursor: pointer;
  border: 0;
  border-radius: 10px;
  padding: 9px 16px;
  font-weight: 600;
  background: linear-gradient(135deg, var(--gold-accent), #b8860b);
  color: #0d1117;
  transition: all 0.2s ease;
}
button:hover {
  background: linear-gradient(135deg, var(--gold-hover), var(--gold-accent));
  transform: translateY(-1px);
}
button.ghost {
  background: transparent;
  border: 1px solid var(--line-color);
  color: var(--txt-muted);
}
button.ghost:hover {
  border-color: var(--gold-accent);
  color: var(--gold-accent);
  background: rgba(212, 175, 55, 0.05);
}
button.danger {
  background: #dc2626;
  color: #fff;
}
button.danger:hover {
  background: #ef4444;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.m {
  max-width: min(750px, 88%);
  padding: 12px 18px;
  border-radius: 16px;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-word;
  box-shadow: 0 2px 8px var(--shadow-color);
}
.bot {
  background: var(--bot-msg);
  border: 1px solid var(--line-color);
  border-top-right-radius: 4px;
  align-self: flex-start;
}
.me {
  background: var(--user-msg);
  border: 1px solid rgba(37, 99, 235, 0.4);
  border-top-left-radius: 4px;
  align-self: flex-end;
}
.file-badge {
  font-size: 12px;
  color: var(--gold-accent);
  margin-top: 6px;
  display: flex;
  align-items: center;
  gap: 4px;
}

form {
  display: flex;
  gap: 10px;
  padding: 14px 20px;
  background: var(--panel-bg);
  border-top: 1px solid var(--line-color);
}

textarea {
  flex: 1;
  resize: none;
  height: 48px;
  background: var(--bg-dark);
  color: var(--txt-main);
  border: 1px solid var(--line-color);
  border-radius: 12px;
  padding: 12px 14px;
  font: inherit;
  outline: none;
  transition: border-color 0.2s;
}
textarea:focus {
  border-color: var(--gold-accent);
}

#fbtn {
  background: var(--card-bg);
  border: 1px solid var(--line-color);
  color: var(--txt-main);
  font-size: 18px;
  padding: 0 16px;
  border-radius: 12px;
}
#fbtn:hover {
  border-color: var(--gold-accent);
}

#pending {
  padding: 0 20px 8px;
  font-size: 12px;
  color: var(--gold-accent);
  background: var(--panel-bg);
}

dialog {
  background: var(--panel-bg);
  color: var(--txt-main);
  border: 1px solid var(--gold-accent);
  border-radius: 16px;
  width: min(800px, 94vw);
  max-height: 88vh;
  padding: 24px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
}
dialog::backdrop {
  background: rgba(0, 0, 0, 0.75);
  backdrop-filter: blur(4px);
}

input[type=password] {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid var(--line-color);
  background: var(--bg-dark);
  color: var(--txt-main);
  margin: 12px 0 18px;
  outline: none;
}
input[type=password]:focus {
  border-color: var(--gold-accent);
}

.panel-actions {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.conv {
  border: 1px solid var(--line-color);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
  background: var(--card-bg);
}
.conv-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line-color);
  padding-bottom: 8px;
  margin-bottom: 8px;
}
.conv-header b {
  color: var(--gold-accent);
}
.conv-item {
  margin-top: 6px;
  font-size: 14px;
  line-height: 1.5;
}
.conv-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

#list {
  max-height: 55vh;
  overflow-y: auto;
  padding-left: 4px;
}
</style>
</head>
<body>

<header>
  <h1>Saher <span>AI</span></h1>
  <button class="ghost" id="adminBtn">لوحة الإدارة</button>
</header>

<div id="chat"></div>
<div id="pending"></div>

<form id="f">
  <input type="file" id="file" hidden>
  <button type="button" id="fbtn" title="رفع ملف">📎</button>
  <textarea id="t" placeholder="اكتب رسالتك..."></textarea>
  <button type="submit">إرسال</button>
</form>

<dialog id="dlg">
  <div id="login">
    <h3 style="margin-top:0; color: var(--gold-accent)">دخول لوحة الإدارة</h3>
    <p style="font-size:14px; color:var(--txt-muted)">يرجى إدخال كلمة مرور الأدمن لعرض الشاتات المحفوظة</p>
    <input type="password" id="pw" placeholder="كلمة المرور">
    <button id="enter">دخول</button> 
    <button class="ghost" id="close1">إغلاق</button>
  </div>

  <div id="panel" hidden>
    <h3 style="margin-top:0; color: var(--gold-accent)">إدارة المحادثات المحفوظة</h3>
    <div class="panel-actions">
      <button id="export">تصدير (JSON)</button>
      <button class="ghost" id="importBtn">استيراد نسخة</button>
      <input type="file" id="importFile" accept=".json" hidden>
      <button class="ghost danger" id="clear">مسح الكل</button>
      <button class="ghost" id="close2" style="margin-right:auto">إغلاق</button>
    </div>
    <div id="list"></div>
  </div>
</dialog>

<script>
// ===== الإعدادات =====
const ADMIN_PASSWORD = "change-me-123";   // غيّر كلمة المرور من هنا
const WEBHOOK_URL = "";                   // رابط إرسال خارجي (اختياري)
const GREETING = "ساهر يسهر الليالى لعيونك اللى مدوبانى \nفى خدمتك يابطل الابطال";
const SYSTEM = "أنت Saher AI، مساعد ذكي ودقيق جدا. نفّذ المهام المطلوبة بدقة وبشكل كامل، وردّ بنفس لغة المستخدم.";

// =====================
const $ = id => document.getElementById(id);
const sid = (() => { 
  try { 
    let s = localStorage.getItem("sid"); 
    if (!s) { 
      s = Math.random().toString(36).slice(2, 10); 
      localStorage.setItem("sid", s); 
    } 
    return s; 
  } catch (e) { return "anon"; } 
})();

let history = [], attached = null;

function add(role, text, fileName) {
  const d = document.createElement("div");
  d.className = "m " + (role === "user" ? "me" : "bot");
  d.textContent = text;
  if (fileName) { 
    const f = document.createElement("div"); 
    f.className = "file-badge"; 
    f.textContent = "📎 " + fileName; 
    d.appendChild(f); 
  }
  $("chat").appendChild(d); 
  $("chat").scrollTop = 1e9; 
  return d;
}

add("bot", GREETING);

function store(entry) {
  try {
    const all = JSON.parse(localStorage.getItem("saher_chats") || "[]");
    all.push(entry); 
    localStorage.setItem("saher_chats", JSON.stringify(all));
  } catch (e) {}
  if (WEBHOOK_URL) {
    fetch(WEBHOOK_URL, { 
      method: "POST", 
      mode: "no-cors", 
      headers: { "Content-Type": "text/plain" }, 
      body: JSON.stringify(entry) 
    }).catch(() => {});
  }
}

$("fbtn").onclick = () => $("file").click();
$("file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  if (f.size > 2e6) { alert("الحد الأقصى للملف 2MB"); return; }
  let content = "";
  if (f.type.startsWith("text/") || /\.(txt|md|csv|json|js|py|html|css|xml)$/i.test(f.name)) {
    content = (await f.text()).slice(0, 12000);
  } else {
    content = "(ملف غير نصي، لم تتم قراءة محتواه)";
  }
  attached = { name: f.name, content };
  $("pending").textContent = "📎 " + f.name + " (جاهز للإرسال مع الرسالة)";
};

$("f").onsubmit = async e => {
  e.preventDefault();
  const text = $("t").value.trim(); 
  if (!text && !attached) return;

  const file = attached; 
  attached = null; 
  $("pending").textContent = ""; 
  $("file").value = ""; 
  $("t").value = "";

  add("user", text, file && file.name);

  let prompt = text || "حلّل هذا الملف";
  if (file) prompt += "\n\n[الملف: " + file.name + "]\n" + file.content;

  history.push({ role: "user", content: prompt });
  const wait = add("bot", "جاري التفكير...");

  let reply;
  try {
    const r = await fetch("https://text.pollinations.ai/openai", {
      method: "POST", 
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ 
        model: "openai", 
        messages: [{ role: "system", content: SYSTEM }, ...history.slice(-20)] 
      })
    });
    const j = await r.json(); 
    reply = j.choices[0].message.content;
  } catch (err) { 
    reply = "تعذر الاتصال بالخادم حالياً، يرجى المحاولة مرة أخرى."; 
  }

  wait.textContent = reply; 
  history.push({ role: "assistant", content: reply });
  store({ session: sid, time: new Date().toISOString(), user: text, file: file ? file.name : null, bot: reply });
};

$("t").addEventListener("keydown", e => { 
  if (e.key === "Enter" && !e.shiftKey) { 
    e.preventDefault(); 
    $("f").requestSubmit(); 
  } 
});

// ===== لوحة الإدارة =====
$("adminBtn").onclick = () => { 
  $("login").hidden = false; 
  $("panel").hidden = true; 
  $("pw").value = ""; 
  $("dlg").showModal(); 
};

$("close1").onclick = $("close2").onclick = () => $("dlg").close();

$("enter").onclick = () => { 
  if ($("pw").value === ADMIN_PASSWORD) { 
    $("login").hidden = true; 
    $("panel").hidden = false; 
    render(); 
  } else {
    alert("كلمة المرور غير صحيحة"); 
  }
};

function render() {
  const all = JSON.parse(localStorage.getItem("saher_chats") || "[]");
  const box = $("list"); 
  box.innerHTML = "";

  if (!all.length) {
    box.textContent = "لا توجد محادثات محفوظة حتى الآن.";
    return;
  }

  all.slice().reverse().forEach((c, idx) => {
    const originalIndex = all.length - 1 - idx;
    const d = document.createElement("div"); 
    d.className = "conv";

    const h = document.createElement("div"); 
    h.className = "conv-header";
    h.innerHTML = `<b>الجلسة: ${c.session}</b><span style="font-size:12px; color:var(--txt-muted)">${new Date(c.time).toLocaleString("ar-EG")}</span>`;

    const u = document.createElement("div"); 
    u.className = "conv-item";
    u.innerHTML = `👤 <strong>المستخدم:</strong> ${c.user || "(بدون نص)"}` + (c.file ? ` <span style="color:var(--gold-accent)">[📎 ${c.file}]</span>` : "");

    const b = document.createElement("div"); 
    b.className = "conv-item";
    b.innerHTML = `🤖 <strong>الرد:</strong> ${c.bot.length > 150 ? c.bot.slice(0, 150) + '...' : c.bot}`;

    const acts = document.createElement("div");
    acts.className = "conv-actions";

    const delBtn = document.createElement("button");
    delBtn.className = "ghost danger";
    delBtn.style.padding = "4px 8px";
    delBtn.style.fontSize = "12px";
    delBtn.textContent = "حذف";
    delBtn.onclick = () => deleteChat(originalIndex);

    acts.appendChild(delBtn);

    d.append(h, u, b, acts); 
    box.appendChild(d);
  });
}

function deleteChat(index) {
  if (confirm("هل أنت تأكد من حذف هذه المحادثة؟")) {
    const all = JSON.parse(localStorage.getItem("saher_chats") || "[]");
    all.splice(index, 1);
    localStorage.setItem("saher_chats", JSON.stringify(all));
    render();
  }
}

$("export").onclick = () => { 
  const data = localStorage.getItem("saher_chats") || "[]";
  const blob = new Blob([data], { type: "application/json" });
  const a = document.createElement("a"); 
  a.href = URL.createObjectURL(blob); 
  a.download = `saher-chats-${new Date().toISOString().slice(0,10)}.json`; 
  a.click(); 
};

$("importBtn").onclick = () => $("importFile").click();

$("importFile").onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const importedData = JSON.parse(evt.target.result);
      if (Array.isArray(importedData)) {
        localStorage.setItem("saher_chats", JSON.stringify(importedData));
        alert("تم استيراد المحادثات بنجاح!");
        render();
      } else {
        alert("تنسيق الملف غير صحيح.");
      }
    } catch(err) {
      alert("حدث خطأ أثناء قراءة الملف.");
    }
  };
  reader.readAsText(file);
};

$("clear").onclick = () => { 
  if (confirm("هل أنت تأكد من مسح جميع المحادثات نهائياً؟")) { 
    localStorage.removeItem("saher_chats"); 
    render(); 
  } 
};
</script>
</body>
</html>
